name: Add Quick app icon

on:
  push:
    paths:
      - '.github/workflows/add-quick-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Quick web app metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('quick.html')
          s = p.read_text()
          if './app-icon.svg' not in s:
              marker = '<meta name="theme-color" content="#f7f5ef" />'
              addition = '''
<link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./app-icon.svg" />
<link rel="manifest" href="./quick.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="FujiFrame" />'''
              if marker not in s:
                  raise SystemExit('theme-color marker not found in quick.html')
              s = s.replace(marker, marker + addition, 1)
              p.write_text(s)
          PY
      - name: Commit icon wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick.html
          git diff --cached --quiet || git commit -m "Add FujiFrame Quick home screen icon"
          git push
