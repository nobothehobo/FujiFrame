name: Build Studio desktop bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/requirements.txt "pyinstaller>=6.16,<7"
      - run: python -m unittest discover -s studio/tests -v
      - name: Bundle the local service and editing interface
        run: python -m PyInstaller --noconfirm --onedir --name FujiFrame-Studio --paths . --collect-all rawpy --collect-all tifffile --add-data "studio/web:studio/web" --distpath studio-build studio/desktop_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: FujiFrame-Studio-${{ matrix.os }}
          path: studio-build/FujiFrame-Studio/
          retention-days: 14
