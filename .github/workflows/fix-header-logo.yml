name: Fix FujiFrame Quick header logo

on:
  push:
    paths:
      - '.github/workflows/fix-header-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original FujiFrame logo in header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('quick.html')
          s = p.read_text()
          old_css = '.app-icon{width:58px;height:42px;object-fit:contain;flex:0 0 auto;background:transparent;image-rendering:pixelated;image-rendering:crisp-edges}'
          new_css = '.app-icon{width:46px;height:46px;object-fit:cover;flex:0 0 auto;border-radius:11px}'
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          old_img = '<img class="app-icon" src="./header-camera.svg" alt="" aria-hidden="true" />'
          new_img = '<img class="app-icon" src="./logo.svg" alt="FujiFrame" />'
          if old_img not in s:
              raise SystemExit('Expected current header image tag not found')
          s = s.replace(old_img, new_img, 1)
          p.write_text(s)
          PY
      - name: Commit original logo restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick.html
          git diff --cached --quiet || git commit -m "Restore original FujiFrame header logo"
          git push
