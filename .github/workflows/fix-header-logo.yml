name: Refresh FujiFrame Home Screen icon

on:
  push:
    paths:
      - '.github/workflows/fix-header-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use fresh original-logo asset for iOS/PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('quick.html')
          s = p.read_text()
          s = s.replace('<link rel="apple-touch-icon" href="./logo.svg" />', '<link rel="apple-touch-icon" href="./home-logo-v2.svg" />')
          s = s.replace('<link rel="manifest" href="./quick.webmanifest" />', '<link rel="manifest" href="./quick.webmanifest?v=2" />')
          p.write_text(s)

          p = Path('quick.webmanifest')
          s = p.read_text()
          s = s.replace('./logo.svg', './home-logo-v2.svg')
          p.write_text(s)

          p = Path('install.html')
          s = p.read_text()
          s = s.replace('<link rel="apple-touch-icon" href="./logo.svg" />', '<link rel="apple-touch-icon" href="./home-logo-v2.svg" />')
          s = s.replace('<link rel="manifest" href="./quick.webmanifest" />', '<link rel="manifest" href="./quick.webmanifest?v=2" />')
          s = s.replace('<img class="icon" src="./logo.svg" alt="FujiFrame logo" />', '<img class="icon" src="./home-logo-v2.svg" alt="FujiFrame logo" />')
          p.write_text(s)
          PY
      - name: Commit Home Screen icon refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quick.html quick.webmanifest install.html
          git diff --cached --quiet || git commit -m "Refresh original FujiFrame Home Screen icon"
          git push
