<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f2efe7;color:#171715;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:28px}.card{width:min(430px,100%);background:#fffdf8;border:1px solid #e5e0d7;border-radius:28px;padding:28px;box-shadow:0 18px 55px #29251b14;text-align:center}.icon{width:132px;height:132px;border-radius:28px;display:block;margin:0 auto 20px;box-shadow:0 10px 28px #0001}h1{font-size:28px;margin:0 0 8px;letter-spacing:-.03em}p{color:#6d6a63;line-height:1.5;margin:0 0 22px}.steps{background:#f6f2e9;border-radius:18px;padding:16px 18px;text-align:left;font-size:15px;line-height:1.7;margin-bottom:16px}.steps b{color:#171715}.open{display:block;text-decoration:none;background:#171715;color:white;padding:15px 18px;border-radius:15px;font-weight:750}.small{font-size:12px;margin:16px 0 0;color:#8c887e}
</style>

<body>
<main class="card">
<img class="icon" src="./logo.svg" alt="FujiFrame logo" />
<h1>FujiFrame</h1>
<p>Your little 4:5 photo-matting app, with the original FujiFrame mark.</p>
<div class="steps"><b>On iPhone:</b><br>1. Tap Safari’s Share button.<br>2. Choose <b>Add to Home Screen</b>.<br>3. Leave <b>Open as Web App</b> on, then tap Add.</div>
<a class="open" href="./quick.html">Open FujiFrame Quick</a>
<p class="small">Once added, the Home Screen icon launches FujiFrame Quick directly.</p>
</main>
